  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#gloss)"/>
  <!-- kalite katmanları / segment destesi -->
  <rect x="292" y="262" width="520" height="380" rx="64" fill="#fff" opacity=".26"/>
  <rect x="252" y="317" width="520" height="380" rx="64" fill="#fff" opacity=".5"/>
